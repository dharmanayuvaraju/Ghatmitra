<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Solar High-Mast Light Illustration -->
  <rect width="80" height="80" rx="16" fill="#fefce8" />
  
  <!-- Foundation Base -->
  <rect x="34" y="66" width="12" height="6" rx="2" fill="#475569" />
  
  <!-- Mast Pole -->
  <rect x="38" y="24" width="4" height="44" fill="#64748b" />
  <rect x="39" y="24" width="2" height="44" fill="#94a3b8" />

  <!-- Solar PV Panel on top -->
  <path d="M26 12 L 48 10 L 54 18 L 32 20 Z" fill="#1e3a8a" stroke="#1d4ed8" stroke-width="1.2" />
  <line x1="37" y1="11" x2="43" y2="19" stroke="#93c5fd" stroke-width="1" />
  <line x1="29" y1="16" x2="51" y2="14" stroke="#93c5fd" stroke-width="1" />

  <!-- LED Flood Fixture Head -->
  <path d="M42 22 L 58 26 L 56 31 L 42 27 Z" fill="#f59e0b" />
  <!-- Radiant Light Beam -->
